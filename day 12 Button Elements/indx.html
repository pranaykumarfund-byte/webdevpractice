<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button elements,type attributes</title>
</head>
<body>
    <button>submit</button>
    <form action="/server">
        <label for="Username">UserName :</label>
        <input <label type ="text" placeholder ="enter user name" id="Username"></label></input>
        <br>
        <label for="Password">Password :</label>
        <input <label type="password" placeholder="password" id="Password"></label></input>
        <br>
        <button>submit</button>
        <br>
        <button type="submit">Button</button>
        <button type="button">do somthing</button>
        <button type="reset">reset</button>
        <br>
        input:
        <input type="submit">
        <input type="submit" value="click me">  
    </form>
    
</body>
</html>
