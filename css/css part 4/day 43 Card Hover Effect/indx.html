<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <img src="men.png" alt="man">
        <div>
            <h3>M Pranay Kumar</h3>
            <P>Software Engineer</P>
        </div>
    </div>
    <div class="card">
        <img src="women.jpg" alt="women">
        <div>
            <h3>Neha Sharma</h3>
            <p>Data Analyst</p>
        </div>
    </div>
    
</body>
</html>
