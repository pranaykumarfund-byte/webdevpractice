<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>include style</title>
</head>
<body>
    <h3 style="color:brown">Using Inline Styles</h3>
    <h1 style="color:red">M Pranay Kumar</h1>
    <p style="color:blue">This is paragraph</p> 
    <button style="color:orange;background-color:black">Help</button>
    <hr>
    <h3 style="color:brown">Using style tags</h3>
    <style>
        h1{
            color:red;
            background-color:black;
        }
    </style>
    <h1>M Pranay Kumar</h1>
    <hr>
</body>
</html>
