<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkbox,radio button</title>
</head>
<body>
    <form action="/server">
        <label for="age">Iam 18+ :</label>
        <input type="checkbox" id="age" name="age">
        <br>
        <button>submit</button>
        <hr>
        <label for="apple">Apple :</label>
        <input type="radio" id="apple" name="fruit" value="apple">
        <label for="mango">Mango :</label>
        <input type="radio" id="mango" name="fruit" value="mango">
        <label for="bannana">Bannana :</label>
        <input type="radio" id="bannana" name="fruit" value="bannana">
        <br>
        <button>submit</button>
    </form>
    
</body>
</html>
